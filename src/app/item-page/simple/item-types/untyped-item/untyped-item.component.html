@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back"></ds-results-back-button>
}
@if (iiifEnabled) {
  <div class="row">
    <div class="col-12">
      <ds-mirador-viewer id="iiif-viewer"
        [object]="object"
        [searchable]="iiifSearchEnabled"
        [query]="iiifQuery$ | async">
      </ds-mirador-viewer>
    </div>
  </div>
}

<div class="signboard">
  <div class="date-fix d-flex flex-row p-3" [class.d-flex]="!(isMobile$ | async)">
    <div class="d-flex align-items-center me-auto">
      <ds-item-page-title-field [item]="object" class="align-content-center">
      </ds-item-page-title-field>
      @if (isAuthenticated$ | async) {
        @if (isFavorited$ | async) {
        <button class="btn btn-outline-light btn-sm ms-3"
                (click)="removeProjectFromFavorites()"
                [disabled]="isFavoriteRequestPending$ | async"
                type="button">
          <i class="fas fa-star"></i>
          В избранном
        </button>
      } @else {
        <button class="btn btn-outline-light btn-sm ms-3"
                (click)="addProjectToFavorites()"
                [disabled]="isFavoriteRequestPending$ | async"
                type="button">
          <i class="fas fa-star"></i>
          Добавить в избранное
        </button>
      }
      }
      @if (!(isAuthenticated$ | async)) {
        <button class="btn btn-outline-light btn-sm ms-3"
                (click)="redirectToLogin()"
                type="button">
          <i class="fas fa-sign-in-alt"></i> Войдите, чтобы <br>
          добавить в избранное
        </button>
      }
    </div>
    <ds-item-page-date-field [item]="object"></ds-item-page-date-field>
    <ds-dso-edit-menu></ds-dso-edit-menu>
  </div>
</div>
<div>
  <div class="mt-3">
    <!--
    @if (!(mediaViewer.image || mediaViewer.video)) {
      <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
        <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
      </ds-metadata-field-wrapper>
    }
    @if (mediaViewer.image || mediaViewer.video) {
      <div class="mb-2">
        <ds-media-viewer [item]="object"></ds-media-viewer>
      </div>
    }
    -->
    <div class="bg">
      <div class="col-gap d-flex" [class.mobile-view]="isMobile$ | async">
        <div style="flex: 3 3 0;">
          <ds-metadata-representation-list class="ds-item-page-mixed-author-field"
            [parentItem]="object"
            [itemType]="'Person'"
            [metadataFields]="['dc.contributor.author', 'dc.creator']"
            [label]="'item.page.authors' | translate">
          </ds-metadata-representation-list>
        </div>
        <div style="flex: 2 2 0;">
          <ds-generic-item-page-field [item]="object"
            [fields]="['dc.subject']"
            [separator]="', '"
            [label]="'item.page.subject'">
          </ds-generic-item-page-field>
        </div>
        <div style="flex: 7 7 0;">
          <ds-item-page-abstract-field [item]="object"></ds-item-page-abstract-field>
        </div>
      </div>
    </div>

    <div class="bg mt-3">
      <div>

        <ds-generic-item-page-field [item]="object"
          [fields]="['journal.title']"
          [label]="'item.page.journal-title'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['journal.identifier.issn']"
          [label]="'item.page.journal-issn'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['journalvolume.identifier.name']"
          [label]="'item.page.volume-title'">
        </ds-generic-item-page-field>


        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.description']"
          [label]="'item.page.description'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.publisher']"
          [label]="'item.page.publisher'">
        </ds-generic-item-page-field>
        <ds-item-page-file-section class="mt-4" [item]="object"></ds-item-page-file-section>


        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.identifier.citation']"
          [label]="'item.page.citation'">
        </ds-generic-item-page-field>
        @if (geospatialItemPageFieldsEnabled) {
          <ds-geospatial-item-page-field [item]="object"
                                        [label]="'item.page.places'"
                                        [pointFields]="['dcterms.spatial']"
                                        [bboxFields]="['dcterms.spatial']"
                                        [cluster]="true"
          >
          </ds-geospatial-item-page-field>
        }

        <ds-item-page-uri-field [item]="object"
          [fields]="['dc.identifier.uri']"
          [label]="'item.page.uri'">
        </ds-item-page-uri-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.identifier.gis']"
          [label]="'item.preview.dc.identifier.gis'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.trl']"
          [label]="'item.preview.dc.trl'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.date.workstart']"
          [label]="'item.preview.dc.date.workstart'">
        </ds-generic-item-page-field>
        <ds-generic-item-page-field [item]="object"
          [fields]="['dc.date.workend']"
          [label]="'item.preview.dc.date.workend'">
        </ds-generic-item-page-field>
        <ds-item-page-collections [item]="object"></ds-item-page-collections>
        <ds-item-page-uri-field [item]="object"
          [fields]="['coar.notify.endorsedBy']"
          [label]="'item.page.endorsement'">
        </ds-item-page-uri-field>
        <ds-item-page-uri-field [item]="object"
          [fields]="['datacite.relation.isReviewedBy']"
          [label]="'item.page.review'">
        </ds-item-page-uri-field>
        <ds-item-page-uri-field [item]="object"
          [fields]="['datacite.relation.isSupplementedBy']"
          [label]="'item.page.supplemented'">
        </ds-item-page-uri-field>
        <ds-item-page-uri-field [item]="object"
          [fields]="['datacite.relation.isReferencedBy']"
          [label]="'item.page.referenced'">
        </ds-item-page-uri-field>
        <ds-item-page-cc-license-field [item]="object" [variant]="'full'">
        </ds-item-page-cc-license-field>
      </div>
    </div>
    <div class="mt-2"></div>
    <div>
      <a class="btn btn-outline-primary" [routerLink]="[itemPageRoute + '/full']" role="button" role="button" tabindex="0">
        <i class="fas fa-info-circle"></i> {{"item.page.link.full" | translate}}
      </a>
    </div>
  </div>

  <!--
  <div class="col-12 col-md-6">

  </div>
  -->
</div>
